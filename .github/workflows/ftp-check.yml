name: Диагностика FTPS без загрузки файлов

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ftp-check.yml'

permissions:
  contents: read

jobs:
  connection:
    name: Проверка соединения FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Проверка FTPS, учётной записи и каталога без изменения файлов
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: '/www/cms.dagstudio.ru/'
          FTP_ENABLED: ${{ vars.FTP_ENABLED }}
        run: |
          python3 - <<'PY'
          import os
          import ssl
          import sys
          from ftplib import FTP_TLS

          required = ('FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')

          def summary(line):
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as out:
                      out.write(line + '\n')

          summary('## Диагностика FTP-подключения DAG STUDIO CMS')
          if missing:
              message = 'Не настроены параметры: ' + ', '.join(missing)
              print('ОШИБКА: ' + message)
              summary('❌ ' + message)
              sys.exit(1)

          host = os.environ['FTP_SERVER'].strip()
          remote_dir = os.environ['FTP_SERVER_DIR'].strip()
          if '://' in host or '/' in host or ':' in host:
              print('ОШИБКА: FTP_SERVER должен содержать только доменное имя сервера (без схемы, пути и порта).')
              summary('❌ Некорректный формат FTP_SERVER')
              sys.exit(1)

          print('Подключение по явному FTPS/TLS на порт 21…')
          try:
              with FTP_TLS(context=ssl.create_default_context(), timeout=25) as ftp:
                  ftp.connect(host, 21)
                  ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
                  ftp.prot_p()
                  if remote_dir:
                      ftp.cwd(remote_dir)
                  ftp.pwd()
          except ssl.SSLCertVerificationError as exc:
              print(f'ОШИБКА FTPS: {type(exc).__name__}: {exc}')
              print('Диагностика публичного сертификата сервера (без отправки логина и пароля):')
              try:
                  import subprocess
                  import tempfile
                  with FTP_TLS(context=ssl._create_unverified_context(), timeout=15) as info:
                      info.connect(host, 21)
                      info.auth()
                      der_cert = info.sock.getpeercert(binary_form=True)
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.pem', encoding='ascii') as certfile:
                      certfile.write(ssl.DER_cert_to_PEM_cert(der_cert))
                      certfile.flush()
                      inspected = subprocess.run(
                          ['openssl', 'x509', '-in', certfile.name, '-noout',
                           '-subject', '-issuer', '-dates', '-ext', 'subjectAltName',
                           '-ext', 'authorityInfoAccess'],
                          capture_output=True, text=True, timeout=10)
                      print(inspected.stdout[:5000] if inspected.stdout else inspected.stderr[:1000])
              except Exception as cert_exc:
                  print(f'Не удалось прочитать сертификат: {type(cert_exc).__name__}')
              summary('❌ Сертификат FTPS не прошёл проверку доверия. Учётные данные не передавались.')
              sys.exit(1)
          except Exception as exc:
              print(f'ОШИБКА FTPS: {type(exc).__name__}: {exc}')
              summary('❌ FTPS-подключение, авторизация или доступ к каталогу не подтверждены. Смотрите лог шага.')
              sys.exit(1)

          print('УСПЕХ: защищённое соединение FTPS и авторизация подтверждены. Файлы не загружались.')
          summary('✅ Установлено защищённое соединение FTPS и выполнен вход.')
          if remote_dir:
              print('Каталог назначения доступен.')
              summary('✅ Каталог FTP_SERVER_DIR доступен.')
          else:
              print('ВНИМАНИЕ: FTP_SERVER_DIR отсутствует, каталог назначения не проверен.')
              summary('⚠️ FTP_SERVER_DIR не задан: каталог назначения не проверен.')
          summary('ℹ️ Проверка не изменяла файлы и не подтверждает право записи.')
          enabled = os.environ.get('FTP_ENABLED', '').strip().lower() == 'true'
          if enabled:
              summary('✅ FTP_ENABLED=true: автоматический деплой разрешён.')
          else:
              summary('⚠️ FTP_ENABLED не равен true: автоматический деплой при push будет пропущен.')
          PY
