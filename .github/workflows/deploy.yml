name: Проверка и публикация DAG STUDIO CMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagcms-production
  cancel-in-progress: false

jobs:
  check:
    name: Проверка PHP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: dagcms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v4
      - name: Установка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Проверка синтаксиса всех PHP-файлов
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: Smoke-тест базы данных
        env:
          DAG_CMS_TEST_MODE: '1'
          TEST_DB_HOST: '127.0.0.1'
          TEST_DB_NAME: 'dagcms_test'
          TEST_DB_USER: 'root'
          TEST_DB_PASS: 'testpassword'
        run: php tests/smoke.php

  deploy:
    name: Загрузка сайта по FTPS
    needs: check
    if: github.event_name == 'workflow_dispatch' || vars.FTP_ENABLED == 'true' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Получение проверенной версии
        uses: actions/checkout@v4
      - name: Проверка переменных подключения
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: '/www/cms.dagstudio.ru/'
        run: |
          test -n "$FTP_SERVER" || { echo "Отсутствует FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Отсутствует FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Отсутствует FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Не указан FTP_SERVER_DIR"; exit 1; }
      - name: Безопасная проверка FTPS и точного каталога перед загрузкой
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import ssl
          from ftplib import FTP_TLS

          host = os.environ['FTP_SERVER'].strip()
          if '://' in host or '/' in host or ':' in host:
              raise SystemExit('Неверный формат FTP_SERVER: укажите только имя сервера')
          directory = '/www/cms.dagstudio.ru/'
          try:
              with FTP_TLS(context=ssl.create_default_context(), timeout=25) as ftp:
                  ftp.connect(host, 21)
                  ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
                  ftp.prot_p()
                  ftp.cwd(directory)
                  ftp.pwd()
          except Exception as exc:
              raise SystemExit(f'Защищённая проверка FTPS не пройдена ({type(exc).__name__}): {exc}')
          print('Проверены TLS-сертификат, вход и доступ к /www/cms.dagstudio.ru/. Можно передавать файлы.')
          PY
      - name: Передача CMS на хостинг (защищённый FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /www/cms.dagstudio.ru/
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/README.md
            **/tests/**
            **/storage/config.php
            **/storage/*.log
