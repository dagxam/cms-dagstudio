name: Проверка и публикация DAG STUDIO CMS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagcms-production
  cancel-in-progress: false

jobs:
  check:
    name: Проверка PHP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: dagcms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v4
      - name: Установка PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Проверка синтаксиса всех PHP-файлов
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: Проверка синтаксиса JavaScript
        run: |
          node --check assets/theme.js
          node --check assets/template-palettes.js
          node --check assets/government.js
      - name: Smoke-тест базы данных
        env:
          DAG_CMS_TEST_MODE: '1'
          TEST_DB_HOST: '127.0.0.1'
          TEST_DB_NAME: 'dagcms_test'
          TEST_DB_USER: 'root'
          TEST_DB_PASS: 'testpassword'
        run: php tests/smoke.php
      - name: Проверка восстановления доступа администратора
        env:
          DAG_CMS_TEST_MODE: '1'
          TEST_DB_HOST: '127.0.0.1'
          TEST_DB_NAME: 'dagcms_test'
          TEST_DB_USER: 'root'
          TEST_DB_PASS: 'testpassword'
        run: php tests/password-recovery.php
      - name: Тест четырёх шаблонов и конструктора
        env:
          DAG_CMS_TEST_MODE: '1'
        run: php tests/templates.php
      - name: Проверка настроек официального сайта
        env:
          DAG_CMS_TEST_MODE: '1'
        run: php tests/government.php
      - name: Проверка HTML всех четырёх типов сайтов
        env:
          DAG_CMS_TEST_MODE: '1'
          TEST_DB_HOST: '127.0.0.1'
          TEST_DB_NAME: 'dagcms_test'
          TEST_DB_USER: 'root'
          TEST_DB_PASS: 'testpassword'
        run: |
          for type in organization company store government; do
            php tests/render-templates.php "$type"
          done


  deploy:
    name: Загрузка сайта по FTPS
    needs: check
    if: github.event_name == 'workflow_dispatch' || vars.FTP_ENABLED == 'true' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Получение проверенной версии
        uses: actions/checkout@v4
      - name: Проверка переменных подключения
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: '/www/cms.dagstudio.ru/'
        run: |
          test -n "$FTP_SERVER" || { echo "Отсутствует FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Отсутствует FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Отсутствует FTP_PASSWORD"; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "Не указан FTP_SERVER_DIR"; exit 1; }
      - name: Подготовка подтверждённой цепочки сертификатов GlobalSign и проверка FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import ssl
          import subprocess
          import urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS

          host = os.environ['FTP_SERVER'].strip()
          if '://' in host or '/' in host or ':' in host:
              raise SystemExit('Неверный формат FTP_SERVER: только имя сервера')
          issuer_url = 'https://secure.globalsign.com/cacert/gsgccr6alphasslca2025.crt'
          ca_der = urllib.request.urlopen(issuer_url, timeout=25).read()
          intermediate = subprocess.run(
              ['openssl', 'x509', '-inform', 'DER', '-outform', 'PEM'],
              input=ca_der, capture_output=True, check=True).stdout

          # Получаем только публичный сертификат. На этом этапе пароль не передаётся.
          with FTP_TLS(context=ssl._create_unverified_context(), timeout=20) as probe:
              probe.connect(host, 21)
              probe.auth()
              leaf = ssl.DER_cert_to_PEM_cert(probe.sock.getpeercert(binary_form=True))

          ca_file = Path('/tmp/dagstudio-ftps-globalsign-intermediate.pem')
          leaf_file = Path('/tmp/dagstudio-ftps-leaf.pem')
          ca_file.write_bytes(intermediate)
          leaf_file.write_text(leaf)
          verification = subprocess.run(
              ['openssl', 'verify',
               '-CAfile', '/etc/ssl/certs/ca-certificates.crt',
               '-untrusted', str(ca_file),
               '-verify_hostname', host, str(leaf_file)],
              capture_output=True, text=True)
          if verification.returncode != 0:
              raise SystemExit('Сертификат FTPS не прошёл проверку имени сервера и цепочки к доверенному корню: ' + (verification.stderr + verification.stdout)[:500])

          # Повторное защищённое соединение: с проверкой сертификата, логином и каталогом.
          ctx = ssl.create_default_context()
          ctx.load_verify_locations(cafile=str(ca_file))
          with FTP_TLS(context=ctx, timeout=25) as ftp:
              ftp.connect(host, 21)
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.cwd('/www/cms.dagstudio.ru/')
              ftp.pwd()

          # Следующий шаг запускается в отдельном Node.js процессе.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('NODE_EXTRA_CA_CERTS=' + str(ca_file) + chr(10))
          print('FTPS: сертификат, имя сервера, авторизация и каталог назначения проверены.')
          PY
      - name: Передача CMS на хостинг (защищённый FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./
          server-dir: /www/cms.dagstudio.ru/
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/README.md
            **/tests/**
            **/assets/uploads/logo-*
            **/assets/uploads/hero-*
            **/assets/uploads/leader-*
            **/storage/config.php
            **/storage/*.log
