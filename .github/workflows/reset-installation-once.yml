name: Однократный сброс установки CMS

on:
  push:
    paths:
      - '.github/workflows/reset-installation-once.yml'

permissions:
  contents: read

jobs:
  reset:
    name: Удаление только старой конфигурации установки
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Проверить FTPS и сбросить привязку к удалённой БД
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import posixpath
          import ssl
          import subprocess
          import urllib.request
          from ftplib import FTP_TLS

          host = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '')
          password = os.environ.get('FTP_PASSWORD', '')
          if not host or '://' in host or '/' in host or ':' in host or not username or not password:
              raise SystemExit('Не указаны действительные FTP_SERVER / FTP_USERNAME / FTP_PASSWORD.')

          # Сертификат SmartApe ранее проверялся с официальным промежуточным GlobalSign.
          issuer = 'https://secure.globalsign.com/cacert/gsgccr6alphasslca2025.crt'
          der_intermediate = urllib.request.urlopen(issuer, timeout=25).read()
          intermediate = subprocess.run(
              ['openssl', 'x509', '-inform', 'DER', '-outform', 'PEM'],
              input=der_intermediate, capture_output=True, check=True).stdout.decode('ascii')

          # Непроверенный TLS используется только для чтения публичного сертификата.
          # Пользовательские реквизиты в этом соединении не передаются.
          with FTP_TLS(context=ssl._create_unverified_context(), timeout=20) as probe:
              probe.connect(host, 21)
              probe.auth()
              leaf = ssl.DER_cert_to_PEM_cert(probe.sock.getpeercert(binary_form=True))

          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              chain = Path(td, 'chain.pem')
              certificate = Path(td, 'leaf.pem')
              chain.write_text(intermediate)
              certificate.write_text(leaf)
              check = subprocess.run([
                  'openssl', 'verify',
                  '-CAfile', '/etc/ssl/certs/ca-certificates.crt',
                  '-untrusted', str(chain),
                  '-verify_hostname', host, str(certificate),
              ], capture_output=True, text=True)
              if check.returncode != 0:
                  raise SystemExit('Сертификат FTPS не прошёл проверку доверия или имени сервера.')

          tls = ssl.create_default_context()
          tls.load_verify_locations(cadata=intermediate)
          with FTP_TLS(context=tls, timeout=25) as ftp:
              ftp.connect(host, 21)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.cwd('/www/cms.dagstudio.ru/')
              roots = {posixpath.basename(entry.rstrip('/')) for entry in ftp.nlst()}
              if not {'install.php', 'index.php', 'storage'}.issubset(roots):
                  raise SystemExit('Сброс остановлен: целевая папка не похожа на DAG STUDIO CMS.')

              ftp.cwd('storage')
              files = {posixpath.basename(entry.rstrip('/')) for entry in ftp.nlst()}
              if 'config.php' in files:
                  ftp.delete('config.php')
                  after = {posixpath.basename(entry.rstrip('/')) for entry in ftp.nlst()}
                  if 'config.php' in after:
                      raise SystemExit('Ошибка: файл старой конфигурации всё ещё присутствует.')
                  print('УСПЕШНО: удалён только /www/cms.dagstudio.ru/storage/config.php.')
              else:
                  print('УСПЕШНО: старый config.php отсутствовал, повторная установка уже разрешена.')

          print('Файлы CMS и другие сайты не изменялись. Мастер install.php доступен для новой установки.')
          PY
